name: Fix buzzer timer and turn offset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-buzzer-timer-offset.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python scripts/fix-buzzer-timer-offset.py
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HostAppV3.tsx src/turn-rules-polish.css tests/buzzerCountdownSource.test.ts
          git commit -m "fix: restore buzzer countdown lifecycle"
          git push origin HEAD:main
