          patch(p, "    const isCorrect = correct ?? suggestion.correct;\n    const wager", "    const isCorrect = correct ?? suggestion.correct;\n    this.recordUndo(room,`Final: ${player.name} ${isCorrect?'correct':'incorrect'}`);\n    const wager")

      - name: Add transport support and tests
        shell: python
        run: |
          from pathlib import Path
          def patch(path, old, new, count=1):
              p=Path(path); text=p.read_text(); found=text.count(old)
              if found != count: raise SystemExit(f'{path}: expected {count}, found {found}: {old[:70]!r}')
              p.write_text(text.replace(old,new,count))
          p='src/lib/socket.ts'
          patch(p, "    case 'host:update-settings': {", "    case 'host:rename-player': return engine.renamePlayer(roomCode,hostToken,String(payload.playerId??''),String(payload.name??''));\n    case 'host:undo': return engine.undoLast(roomCode,hostToken);\n    case 'host:request-diagnostics': { engine.requestDiagnostics(roomCode,hostToken); for(const target of connections){const identity=identities.get(target);if(identity?.role==='player'&&identity.roomCode===roomCode)sendEvent(target,'diagnostics:request',{startedAt:Date.now()});} return null; }\n    case 'host:update-settings': {")
          patch(p, "    case 'player:buzz': {", "    case 'player:ping': return engine.pingPlayer(roomCode,String(payload.playerId??''),String(payload.reconnectToken??''));\n    case 'player:diagnostic': return engine.updatePlayerDiagnostics(roomCode,String(payload.playerId??''),String(payload.reconnectToken??''),{latencyMs:Number(payload.latencyMs),haptics:Boolean(payload.haptics),inputTested:Boolean(payload.inputTested)});\n    case 'player:buzz': {")
          Path('tests/experienceFeatures.test.ts').write_text("""import { beforeEach,describe,expect,it } from 'vitest';
import { BrowserGameEngine,type RandomSource } from '../src/lib/browserGameEngine';
import { preferredDifficultyForRow } from '../src/lib/boardBalance';
import { gameAwards } from '../src/lib/awards';
import { GAME_PRESETS } from '../src/shared/config';
import type { Player } from '../src/shared/types';
class MemoryStorage implements Storage { private values=new Map<string,string>(); get length(){return this.values.size} clear(){this.values.clear()} getItem(k:string){return this.values.get(k)??null} key(i:number){return [...this.values.keys()][i]??null} removeItem(k:string){this.values.delete(k)} setItem(k:string,v:string){this.values.set(k,String(v))} }
class FixedRandom implements RandomSource { next(){return .23} }
beforeEach(()=>Object.defineProperty(globalThis,'localStorage',{value:new MemoryStorage(),configurable:true}));
describe('experience systems',()=>{
 it('assigns stable seats and reuses freed seats',()=>{const e=new BrowserGameEngine(new FixedRandom(),60000);const h=e.createRoom('https://x');const a=e.joinPlayer(h.roomCode,{name:'A',avatar:'A',accent:'#ffffff'});e.joinPlayer(h.roomCode,{name:'B',avatar:'B',accent:'#ffffff'});expect(e.snapshot(h.roomCode).players.map(p=>p.seat)).toEqual([1,2]);e.setPlayerConnected(h.roomCode,a.playerId,false);e.reconnectPlayer(h.roomCode,a.playerId,a.reconnectToken);expect(e.snapshot(h.roomCode).players[0].seat).toBe(1);e.removePlayer(h.roomCode,h.hostToken,a.playerId);e.joinPlayer(h.roomCode,{name:'C',avatar:'C',accent:'#ffffff'});expect(e.snapshot(h.roomCode).players.map(p=>p.seat).sort()).toEqual([1,2]);});
 it('stores diagnostics and undoes score changes',()=>{const e=new BrowserGameEngine(new FixedRandom(),60000);const h=e.createRoom('https://x');const p=e.joinPlayer(h.roomCode,{name:'A',avatar:'A',accent:'#ffffff'});e.updatePlayerDiagnostics(h.roomCode,p.playerId,p.reconnectToken,{latencyMs:42,haptics:true,inputTested:true});expect(e.snapshot(h.roomCode).players[0].diagnostics?.latencyMs).toBe(42);e.adjustScore(h.roomCode,h.hostToken,p.playerId,500);expect(e.snapshot(h.roomCode).players[0].score).toBe(500);e.undoLast(h.roomCode,h.hostToken);expect(e.snapshot(h.roomCode).players[0].score).toBe(0);});
 it('renames players safely',()=>{const e=new BrowserGameEngine(new FixedRandom(),60000);const h=e.createRoom('https://x');const a=e.joinPlayer(h.roomCode,{name:'A',avatar:'A',accent:'#ffffff'});e.joinPlayer(h.roomCode,{name:'B',avatar:'B',accent:'#ffffff'});e.renamePlayer(h.roomCode,h.hostToken,a.playerId,'Renamed');expect(e.snapshot(h.roomCode).players[0].name).toBe('Renamed');expect(()=>e.renamePlayer(h.roomCode,h.hostToken,a.playerId,'B')).toThrow(/already uses/i);});
 it('balances row difficulty',()=>{expect(preferredDifficultyForRow(0,6)).toBe('easy');expect(preferredDifficultyForRow(2,6)).toBe('medium');expect(preferredDifficultyForRow(5,6)).toBe('hard');});
 it('ships four presets',()=>{expect(Object.keys(GAME_PRESETS)).toEqual(['casual','fast','competitive','party']);});
