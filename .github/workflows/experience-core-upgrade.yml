          # Tests for the newly authoritative production behavior.
          Path('tests/experienceFeatures.test.ts').write_text("""import { beforeEach, describe, expect, it } from 'vitest';
import { BrowserGameEngine, type RandomSource } from '../src/lib/browserGameEngine';
import { preferredDifficultyForRow } from '../src/lib/boardBalance';
import { gameAwards } from '../src/lib/awards';
import { GAME_PRESETS } from '../src/shared/config';
import type { Player } from '../src/shared/types';

class MemoryStorage implements Storage {
  private values = new Map<string, string>();
  get length() { return this.values.size; }
  clear() { this.values.clear(); }
  getItem(key: string) { return this.values.get(key) ?? null; }
  key(index: number) { return [...this.values.keys()][index] ?? null; }
  removeItem(key: string) { this.values.delete(key); }
  setItem(key: string, value: string) { this.values.set(key, String(value)); }
}
class FixedRandom implements RandomSource { next() { return 0.23; } }

beforeEach(() => Object.defineProperty(globalThis, 'localStorage', { value: new MemoryStorage(), configurable: true }));

describe('experience systems', () => {
  it('assigns permanent seats and reuses only freed seats', () => {
    const engine = new BrowserGameEngine(new FixedRandom(), 60_000);
    const host = engine.createRoom('https://example.test');
    const one = engine.joinPlayer(host.roomCode, { name: 'One', avatar: '1', accent: '#ffffff' });
    const two = engine.joinPlayer(host.roomCode, { name: 'Two', avatar: '2', accent: '#ffffff' });
    expect(engine.snapshot(host.roomCode).players.map((player) => player.seat)).toEqual([1, 2]);
    engine.setPlayerConnected(host.roomCode, one.playerId, false);
    engine.reconnectPlayer(host.roomCode, one.playerId, one.reconnectToken);
    expect(engine.snapshot(host.roomCode).players.find((player) => player.id === one.playerId)?.seat).toBe(1);
    engine.removePlayer(host.roomCode, host.hostToken, one.playerId);
    engine.joinPlayer(host.roomCode, { name: 'Three', avatar: '3', accent: '#ffffff' });
    expect(engine.snapshot(host.roomCode).players.map((player) => player.seat).sort()).toEqual([1, 2]);
    expect(two.playerId).toBeTruthy();
  });

  it('stores controller diagnostics and allows a host undo of manual scoring', () => {
    const engine = new BrowserGameEngine(new FixedRandom(), 60_000);
    const host = engine.createRoom('https://example.test');
    const player = engine.joinPlayer(host.roomCode, { name: 'Alex', avatar: 'A', accent: '#ffffff' });
    engine.updatePlayerDiagnostics(host.roomCode, player.playerId, player.reconnectToken, { latencyMs: 42, haptics: true, inputTested: true });
    expect(engine.snapshot(host.roomCode).players[0].diagnostics?.latencyMs).toBe(42);
    engine.adjustScore(host.roomCode, host.hostToken, player.playerId, 500);
    expect(engine.snapshot(host.roomCode).players[0].score).toBe(500);
    expect(engine.snapshot(host.roomCode).undoLabel).toMatch(/Score/);
    engine.undoLast(host.roomCode, host.hostToken);
    expect(engine.snapshot(host.roomCode).players[0].score).toBe(0);
    expect(engine.snapshot(host.roomCode).undoLabel).toBeNull();
  });

  it('renames players without allowing duplicate names', () => {
    const engine = new BrowserGameEngine(new FixedRandom(), 60_000);
    const host = engine.createRoom('https://example.test');
    const one = engine.joinPlayer(host.roomCode, { name: 'One', avatar: '1', accent: '#ffffff' });
    engine.joinPlayer(host.roomCode, { name: 'Two', avatar: '2', accent: '#ffffff' });
    engine.renamePlayer(host.roomCode, host.hostToken, one.playerId, 'Renamed');
    expect(engine.snapshot(host.roomCode).players[0].name).toBe('Renamed');
    expect(() => engine.renamePlayer(host.roomCode, host.hostToken, one.playerId, 'Two')).toThrow(/already uses/i);
  });

  it('maps board rows to progressively harder preferred difficulty', () => {
    expect(preferredDifficultyForRow(0, 6)).toBe('easy');
    expect(preferredDifficultyForRow(2, 6)).toBe('medium');
    expect(preferredDifficultyForRow(5, 6)).toBe('hard');
  });

  it('ships four complete game presets', () => {
    expect(Object.keys(GAME_PRESETS)).toEqual(['casual', 'fast', 'competitive', 'party']);
    expect(GAME_PRESETS.fast.settings.gameLength).toBe('quick');
    expect(GAME_PRESETS.party.settings.gameLength).toBe('marathon');
  });

  it('produces useful endgame awards', () => {
    const base = { connected: true, positiveStreak: 0, coldStreak: 0, onFire: false, isCold: false, buzzEligible: false, hasBuzzedThisQuestion: false, finalWager: null, finalWagerSubmitted: false, finalAnswer: null, finalAnswerSubmitted: false, finalResolved: false };
    const stats = (pointsGained: number, fastestBuzzMs: number) => ({ correct: 4, incorrect: 1, longestStreak: 3, longestColdStreak: 1, dailyDoublesFound: 1, biggestWager: 500, fastestBuzzMs, pointsGained, pointsLost: 100 });
    const players = [
      { ...base, id: 'a', name: 'A', avatar: 'A', accent: '#fff', score: 1000, stats: stats(1200, 310) },
      { ...base, id: 'b', name: 'B', avatar: 'B', accent: '#fff', score: 900, stats: stats(900, 250) }
    ] as Player[];
    const awards = gameAwards(players);
    expect(awards.find((award) => award.key === 'points')?.playerIds).toEqual(['a']);
    expect(awards.find((award) => award.key === 'buzz')?.playerIds).toEqual(['b']);
  });
});
""")

