name: Experience core upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/experience-core-upgrade.yml'
      - 'scripts/apply-experience-upgrade.py'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply upgrade
        run: python scripts/apply-experience-upgrade.py
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "feat: add robust game experience systems"
          git push
