name: Experience core upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/experience-core-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Add shared experience systems
        shell: python
        run: |
          from pathlib import Path
          def patch(path, old, new, count=1):
              p=Path(path); text=p.read_text(); found=text.count(old)
              if found != count: raise SystemExit(f'{path}: expected {count}, found {found}: {old[:70]!r}')
              p.write_text(text.replace(old,new,count))

          patch('src/shared/types.ts', "export interface QuestionPack {\n  id: string;\n  title: string;\n  theme: string;\n  description: string;\n  difficulty: Difficulty;\n  approximateMinutes: number;\n  questions: Question[];\n}", "export interface QuestionPack {\n  id: string;\n  title: string;\n  theme: string;\n  description: string;\n  difficulty: Difficulty;\n  approximateMinutes: number;\n  accentColor?: string;\n  titleArt?: string;\n  categoryOrder?: string[];\n  finalQuestionId?: string;\n  questions: Question[];\n}")
          patch('src/shared/types.ts', "  controllerBuzzersEnabled: boolean;\n}\n\nexport interface PlayerStats", "  controllerBuzzersEnabled: boolean;\n  largeTextMode: boolean;\n  highContrastMode: boolean;\n  reducedMotionMode: boolean;\n  soundCaptions: boolean;\n}\n\nexport interface PlayerDiagnostics {\n  latencyMs: number | null;\n  haptics: boolean;\n  inputTested: boolean;\n  checkedAt: number;\n}\n\nexport interface PlayerStats")
          patch('src/shared/types.ts', "export interface Player {\n  id: string;\n  name: string;\n  avatar: string;", "export interface Player {\n  id: string;\n  name: string;\n  avatar: string;\n  seat?: number;\n  diagnostics?: PlayerDiagnostics | null;")
          patch('src/shared/types.ts', "  gameEndedAt: number | null;\n}", "  gameEndedAt: number | null;\n  undoLabel?: string | null;\n}")
          patch('src/shared/types.ts', "  approximateMinutes: number;\n}\n", "  approximateMinutes: number;\n  accentColor?: string;\n  titleArt?: string;\n  categoryOrder?: string[];\n  finalQuestionId?: string;\n}\n", 1)

          patch('src/shared/config.ts', "  controllerBuzzersEnabled: true\n};", "  controllerBuzzersEnabled: true,\n  largeTextMode: false,\n  highContrastMode: false,\n  reducedMotionMode: false,\n  soundCaptions: false\n};")
          patch('src/shared/config.ts', "export const AVATARS =", "export type GamePresetId = 'casual' | 'fast' | 'competitive' | 'party';\nexport const GAME_PRESETS: Record<GamePresetId, { label: string; description: string; settings: Partial<GameSettings> }> = {\n  casual: { label:'Casual', description:'Relaxed timing and gentler scoring.', settings:{ gameLength:'standard', timerSeconds:null, dailyDoublesEnabled:true, dailyDoubleCount:2, allowNegativeScores:false, lateGameModifiers:false, streaksEnabled:true, finalRoundEnabled:true } },\n  fast: { label:'Fast', description:'Short board and quick timers.', settings:{ gameLength:'quick', timerSeconds:10, dailyDoublesEnabled:true, dailyDoubleCount:1, allowNegativeScores:true, lateGameModifiers:true, streaksEnabled:true, finalRoundEnabled:true } },\n  competitive: { label:'Competitive', description:'Full scoring pressure and standard pacing.', settings:{ gameLength:'standard', timerSeconds:15, dailyDoublesEnabled:true, dailyDoubleCount:3, allowNegativeScores:true, lateGameModifiers:true, dailyDoubleStacksWithMultiplier:true, streaksEnabled:true, coldStreakThreshold:3, finalRoundEnabled:true } },\n  party: { label:'Party', description:'Long board with more swing moments.', settings:{ gameLength:'marathon', timerSeconds:20, dailyDoublesEnabled:true, dailyDoubleCount:4, allowNegativeScores:true, lateGameModifiers:true, dailyDoubleStacksWithMultiplier:true, streaksEnabled:true, coldStreakThreshold:2, finalRoundEnabled:true } }\n};\n\nexport const AVATARS =")

          Path('src/lib/boardBalance.ts').write_text("""import type { Question } from '../shared/types';
export function preferredDifficultyForRow(rowIndex:number,rowCount:number): Question['difficulty'] {
  if (rowCount <= 1) return 'medium';
  const ratio=rowIndex/Math.max(1,rowCount-1);
  return ratio < .34 ? 'easy' : ratio < .67 ? 'medium' : 'hard';
}
""")
          Path('src/lib/awards.ts').write_text("""import type { Player } from '../shared/types';
export interface GameAward { key:string; title:string; detail:string; playerIds:string[] }
function topBy(players:Player[], value:(p:Player)=>number|null, positive=true): Player[] { const s=players.map(player=>({player,value:value(player)})).filter((x):x is {player:Player;value:number}=>x.value!==null&&Number.isFinite(x.value)); if(!s.length)return[]; const best=Math.max(...s.map(x=>x.value)); if(positive&&best<=0)return[]; return s.filter(x=>x.value===best).map(x=>x.player); }
function lowBy(players:Player[], value:(p:Player)=>number|null): Player[] { const s=players.map(player=>({player,value:value(player)})).filter((x):x is {player:Player;value:number}=>x.value!==null&&Number.isFinite(x.value)); if(!s.length)return[]; const best=Math.min(...s.map(x=>x.value)); return s.filter(x=>x.value===best).map(x=>x.player); }
export function gameAwards(players:Player[]):GameAward[]{ const out:GameAward[]=[]; const add=(key:string,title:string,detail:string,w:Player[])=>{if(w.length)out.push({key,title,detail,playerIds:w.map(p=>p.id)})}; add('points','Point Machine','Most total points gained',topBy(players,p=>p.stats.pointsGained)); add('streak','Hot Hand','Longest correct-answer streak',topBy(players,p=>p.stats.longestStreak)); add('wager','High Roller','Largest wager of the game',topBy(players,p=>p.stats.biggestWager)); add('daily-double','Daily Double Hunter','Most Daily Doubles found',topBy(players,p=>p.stats.dailyDoublesFound)); const attempted=players.filter(p=>p.stats.correct+p.stats.incorrect>=2); add('accuracy','Sharp Shooter','Best accuracy with at least two rulings',topBy(attempted,p=>p.stats.correct/Math.max(1,p.stats.correct+p.stats.incorrect),false)); add('buzz','Fastest Finger','Fastest registered buzz',lowBy(players,p=>p.stats.fastestBuzzMs)); return out; }
export const awardsForPlayer=(players:Player[],id:string)=>gameAwards(players).filter(a=>a.playerIds.includes(id));
""")

          patch('src/packs/index.ts', "  return builtInPacks.map(({ id, title, theme, description, questions, difficulty, approximateMinutes }) => ({\n    id,\n    title,\n    theme,\n    description,\n    questionCount: questions.length,\n    difficulty,\n    approximateMinutes\n  }));", "  return builtInPacks.map(({ id, title, theme, description, questions, difficulty, approximateMinutes, accentColor, titleArt, categoryOrder, finalQuestionId }) => ({ id, title, theme, description, questionCount:questions.length, difficulty, approximateMinutes, accentColor, titleArt, categoryOrder, finalQuestionId }));")
          patch('src/packs/buildPack.ts', "  if (!categories.length) throw new Error(`${meta.id} must contain at least one category`);", "  if (!categories.length) throw new Error(`${meta.id} must contain at least one category`);\n  if (meta.accentColor && !/^#[0-9a-f]{6}$/i.test(meta.accentColor)) throw new Error(`${meta.id} accentColor must be a six-digit hex color`);")
          patch('src/packs/buildPack.ts', "  return { ...meta, questions };", "  if (meta.categoryOrder) { const known=new Set(categories.map(item=>item.name)); const unknown=meta.categoryOrder.filter(name=>!known.has(name)); if(unknown.length) throw new Error(`${meta.id} categoryOrder contains unknown categories: ${unknown.join(', ')}`); }\n  if (meta.finalQuestionId && !questions.some(item=>item.id===meta.finalQuestionId)) throw new Error(`${meta.id} finalQuestionId does not match a question in the pack`);\n  return { ...meta, questions };")

          patch('src/lib/audio.ts', "type Cue = 'click' | 'open' | 'buzz' | 'locked' | 'correct' | 'wrong' | 'daily-double' | 'fire' | 'cold' | 'phase' | 'reveal';", "export type Cue = 'click' | 'open' | 'buzz' | 'locked' | 'correct' | 'wrong' | 'daily-double' | 'fire' | 'cold' | 'phase' | 'reveal' | 'category' | 'round' | 'diagnostic' | 'score' | 'winner';")
          patch('src/lib/audio.ts', "  cue(name: Cue): void {\n    if (!this.context || !this.effects || this.settings.muted) return;", "  cue(name: Cue): void {\n    if (typeof window !== 'undefined') window.dispatchEvent(new CustomEvent('blue-stage:audio-cue', { detail:name }));\n    if (!this.context || !this.effects || this.settings.muted) return;")
          patch('src/lib/audio.ts', "      phase: [[330, 0, .06], [494, .06, .08], [659, .13, .14]],\n      reveal: [[523, 0, .06], [659, .055, .07], [784, .11, .09], [1047, .19, .18]]", "      phase: [[330,0,.06],[494,.06,.08],[659,.13,.14]],\n      reveal: [[523,0,.06],[659,.055,.07],[784,.11,.09],[1047,.19,.18]],\n      category: [[392,0,.07],[523,.07,.08],[659,.14,.1],[784,.23,.18]],\n      round: [[196,0,.12],[392,.09,.12],[523,.2,.14],[784,.32,.24]],\n      diagnostic: [[523,0,.06],[784,.08,.12]],\n      score: [[659,0,.05],[880,.05,.1]],\n      winner: [[523,0,.08],[659,.07,.08],[784,.14,.1],[1047,.23,.28]]")

      - name: Upgrade authoritative engine
        shell: python
        run: |
          from pathlib import Path
          def patch(path, old, new, count=1):
              p=Path(path); text=p.read_text(); found=text.count(old)
              if found != count: raise SystemExit(f'{path}: expected {count}, found {found}: {old[:70]!r}')
              p.write_text(text.replace(old,new,count))
          p='src/lib/browserGameEngine.ts'
          patch(p, "import { packMap } from '../packs';", "import { packMap } from '../packs';\nimport { preferredDifficultyForRow } from './boardBalance';")
          patch(p, "  finalQuestionId: string | null;\n}", "  finalQuestionId: string | null;\n  undoState?: RoomState | null;\n}")
          patch(p, "const STORAGE_KEY = 'blue-stage-p2p-engine-v2';\nconst ROOM_TTL_MS", "const STORAGE_KEY = 'blue-stage-p2p-engine-v2';\nconst STORAGE_BACKUP_KEY = 'blue-stage-p2p-engine-v2-backup';\nconst ROOM_TTL_MS")
          patch(p, "function loadRooms(): RoomRecord[] {\n  try {\n    const raw = localStorage.getItem(STORAGE_KEY);\n    if (!raw) return [];\n    const parsed = JSON.parse(raw) as RoomRecord[];\n    return Array.isArray(parsed) ? parsed : [];\n  } catch { return []; }\n}", "function loadRooms(): RoomRecord[] { const parse=(raw:string|null):RoomRecord[]|null=>{if(!raw)return null;try{const value=JSON.parse(raw) as RoomRecord[];return Array.isArray(value)?value:null}catch{return null}}; return parse(localStorage.getItem(STORAGE_KEY)) ?? parse(localStorage.getItem(STORAGE_BACKUP_KEY)) ?? []; }")
          patch(p, "      const previouslyConnected = record.state.players.filter((player) => player.connected).map((player) => player.id);\n      record.state.hostConnected = false;", "      const previouslyConnected = record.state.players.filter((player) => player.connected).map((player) => player.id);\n      const usedSeats=new Set<number>();\n      record.state.players.forEach(player=>{ let seat=player.seat; if(!seat||seat<1||seat>5||usedSeats.has(seat)) seat=[1,2,3,4,5].find(candidate=>!usedSeats.has(candidate))??5; player.seat=seat; player.diagnostics??=null; usedSeats.add(seat); });\n      record.state.undoLabel??=null; record.undoState??=null;\n      record.state.hostConnected = false;")
          patch(p, "  private persist(): void {\n    try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...this.rooms.values()])); }\n    catch { /* keep the in-memory game running */ }\n  }", "  private persist(): void { try { const serialized=JSON.stringify([...this.rooms.values()]); const previous=localStorage.getItem(STORAGE_KEY); if(previous&&previous!==serialized)localStorage.setItem(STORAGE_BACKUP_KEY,previous); localStorage.setItem(STORAGE_KEY,serialized); } catch { /* keep the in-memory game running */ } }")
          patch(p, "      gameEndedAt: null\n    };\n    this.rooms.set(code, { state, hostToken, playerTokens: {}, questions: {}, finalQuestionId: null });", "      gameEndedAt: null,\n      undoLabel: null\n    };\n    this.rooms.set(code, { state, hostToken, playerTokens: {}, questions: {}, finalQuestionId: null, undoState:null });")
          patch(p, "    const name = duplicateCount ? `${input.name} ${duplicateCount + 1}` : input.name;\n    room.state.players.push({\n      id: playerId, name, avatar: input.avatar, accent: input.accent, score: 0, connected: true,", "    const name = duplicateCount ? `${input.name} ${duplicateCount + 1}` : input.name;\n    const usedSeats=new Set(room.state.players.map(player=>player.seat).filter((seat):seat is number=>Boolean(seat))); const seat=[1,2,3,4,5].find(candidate=>!usedSeats.has(candidate)); if(!seat) throw new Error('No player seats are available');\n    room.state.players.push({\n      id: playerId, name, avatar: input.avatar, accent: input.accent, seat, diagnostics:null, score: 0, connected: true,")
          patch(p, "  updateSettings(roomCode: string, hostToken: string, updates: Partial<GameSettings>): RoomSnapshot {", "  renamePlayer(roomCode:string,hostToken:string,playerId:string,nextName:string):RoomSnapshot { const room=this.hostRoom(roomCode,hostToken); const player=room.state.players.find(item=>item.id===playerId); if(!player)throw new Error('Player not found'); const name=nextName.trim().slice(0,24); if(!name)throw new Error('Player name cannot be empty'); if(room.state.players.some(item=>item.id!==playerId&&item.name.toLowerCase()===name.toLowerCase()))throw new Error('Another player already uses that name'); player.name=name; this.persist(); return this.snapshot(roomCode); }\n\n  requestDiagnostics(roomCode:string,hostToken:string):RoomSnapshot { const room=this.hostRoom(roomCode,hostToken); room.state.players.filter(player=>player.connected).forEach(player=>{player.diagnostics=null}); this.persist(); return this.snapshot(roomCode); }\n  pingPlayer(roomCode:string,playerId:string,reconnectToken:string):{serverNow:number} { this.playerRoom(roomCode,playerId,reconnectToken); return {serverNow:Date.now()}; }\n  updatePlayerDiagnostics(roomCode:string,playerId:string,reconnectToken:string,input:{latencyMs:number;haptics:boolean;inputTested:boolean}):RoomSnapshot { const [room,player]=this.playerRoom(roomCode,playerId,reconnectToken); player.diagnostics={latencyMs:Number.isFinite(input.latencyMs)?Math.max(0,Math.min(5000,Math.round(input.latencyMs))):5000,haptics:Boolean(input.haptics),inputTested:Boolean(input.inputTested),checkedAt:Date.now()}; this.persist(); return this.snapshot(roomCode); }\n\n  updateSettings(roomCode: string, hostToken: string, updates: Partial<GameSettings>): RoomSnapshot {")
          patch(p, "    const pool = selectedPacks.flatMap((pack) => pack.questions);", "    const pool = selectedPacks.flatMap(pack=>pack.questions.filter(question=>question.id!==pack.finalQuestionId));")
          patch(p, "    if (settings.randomizeCategories) usable = this.shuffle(usable);", "    if (settings.randomizeCategories) usable = this.shuffle(usable);\n    else if(selectedPacks.length===1&&selectedPacks[0].categoryOrder?.length){const order=new Map(selectedPacks[0].categoryOrder.map((name,index)=>[name,index])); usable.sort((a,b)=>(order.get(a[0])??999)-(order.get(b[0])??999));}")
          patch(p, "      for (const value of QUESTION_VALUES.slice(0, config.rows)) {\n        const candidates = sourceQuestions.filter((question) => question.value === value);\n        const unseen = candidates.filter((question) => !this.seenQuestionIds.has(question.id));\n        const chosenQuestion = this.shuffle(unseen.length ? unseen : candidates)[0];", "      for (const [rowIndex,value] of QUESTION_VALUES.slice(0,config.rows).entries()) {\n        const candidates=sourceQuestions.filter(question=>question.value===value); const preferredDifficulty=preferredDifficultyForRow(rowIndex,config.rows); const preferred=candidates.filter(question=>question.difficulty===preferredDifficulty); const unseenPreferred=preferred.filter(question=>!this.seenQuestionIds.has(question.id)); const unseen=candidates.filter(question=>!this.seenQuestionIds.has(question.id)); const chosenQuestion=this.shuffle(unseenPreferred.length?unseenPreferred:preferred.length?preferred:unseen.length?unseen:candidates)[0];")
          patch(p, "    room.state.gameEndedAt = null;\n    room.state.players.forEach((player) => this.resetPlayerForGame(player));", "    room.state.gameEndedAt = null;\n    room.state.undoLabel = null; room.undoState = null;\n    room.state.players.forEach((player) => this.resetPlayerForGame(player));", 1)
          patch(p, "    room.state.finalRound = null;\n    room.finalQuestionId = null;\n    room.state.players.forEach((player) => this.resetPlayerForGame(player));", "    room.state.finalRound = null;\n    room.finalQuestionId = null; room.state.undoLabel=null; room.undoState=null;\n    room.state.players.forEach((player) => this.resetPlayerForGame(player));")
          patch(p, "    if (room.state.phase !== 'board' || !room.state.board) throw new Error('Board is not ready');\n    const tile", "    if (room.state.phase !== 'board' || !room.state.board) throw new Error('Board is not ready');\n    room.undoState=null; room.state.undoLabel=null;\n    const tile")
          patch(p, "  private addScore(player: Player, delta: number, settings: GameSettings): void {", "  private recordUndo(room:RoomRecord,label:string):void { room.undoState=structuredClone(room.state); room.state.undoLabel=label; }\n  undoLast(roomCode:string,hostToken:string):RoomSnapshot { const room=this.hostRoom(roomCode,hostToken); if(!room.undoState)throw new Error('There is nothing to undo'); room.state=structuredClone(room.undoState); room.undoState=null; room.state.undoLabel=null; this.touch(room); this.persist(); return this.snapshot(roomCode); }\n\n  private addScore(player: Player, delta: number, settings: GameSettings): void {")
          patch(p, "    if (!current.dailyDouble && current.buzzWinnerId !== playerId) throw new Error('Only the buzz winner can be resolved');\n    let points", "    if (!current.dailyDouble && current.buzzWinnerId !== playerId) throw new Error('Only the buzz winner can be resolved');\n    this.recordUndo(room,`Ruling: ${player.name} ${correct?'correct':'incorrect'}`);\n    let points")
          patch(p, "    if (response.resolvedCorrect !== null) throw new Error('Response is already graded');\n    response.resolvedCorrect = correct;", "    if (response.resolvedCorrect !== null) throw new Error('Response is already graded');\n    this.recordUndo(room,`Free response: ${player.name} ${correct?'correct':'incorrect'}`);\n    response.resolvedCorrect = correct;")
          patch(p, "    if (!player || !Number.isFinite(delta) || Math.abs(delta) > 100_000) throw new Error('Invalid score adjustment');\n    this.addScore", "    if (!player || !Number.isFinite(delta) || Math.abs(delta) > 100_000) throw new Error('Invalid score adjustment');\n    this.recordUndo(room,`Score: ${player.name} ${delta>=0?'+':''}${Math.round(delta)}`);\n    this.addScore")
