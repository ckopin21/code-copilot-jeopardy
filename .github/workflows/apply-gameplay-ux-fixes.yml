name: Apply gameplay UX fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gameplay-ux-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/components/HostEnhancements.tsx',
              '      duration = 2900;',
              '      duration = 5500;'
          )
          replace_once(
              'src/components/HostEnhancements.tsx',
              '    {transition && <div className="game-transition-overlay" key={transition.key} aria-live="polite">',
              '    {transition && <div className={`game-transition-overlay ${transition.categories ? \'category-transition\' : \'\'}`} key={transition.key} aria-live="polite">'
          )

          replace_once(
              'src/components/HostAppV3.tsx',
              '<PlayerStrip players={room.players} activeId={current?.buzzWinnerId ?? current?.dailyDoublePlayerId} scoreOverrides={scoreOverrides} />',
              '<PlayerStrip players={room.players} activeId={current?.buzzWinnerId ?? current?.dailyDoublePlayerId} turnId={room.turnPlayerId} scoreOverrides={scoreOverrides} />'
          )

          replace_once(
              'src/components/PlayerStrip.tsx',
              'export function PlayerStrip({ players, activeId, scoreOverrides = {} }: { players: Player[]; activeId?: string | null; scoreOverrides?: Record<string, number> }) {',
              'export function PlayerStrip({ players, activeId, turnId, scoreOverrides = {} }: { players: Player[]; activeId?: string | null; turnId?: string | null; scoreOverrides?: Record<string, number> }) {'
          )
          replace_once(
              'src/components/PlayerStrip.tsx',
              "          <section data-player-id={player.id} key={player.id} className={`player-card showcase-player-card ${activeId === player.id ? 'is-active' : ''} ${player.onFire ? 'is-fire' : ''} ${player.isCold ? 'is-cold' : ''}`} style={{ '--accent': player.accent } as React.CSSProperties}>",
              "          <section data-player-id={player.id} key={player.id} className={`player-card showcase-player-card ${activeId === player.id ? 'is-active' : ''} ${turnId === player.id ? 'is-turn' : ''} ${player.onFire ? 'is-fire' : ''} ${player.isCold ? 'is-cold' : ''}`} style={{ '--accent': player.accent } as React.CSSProperties}>"
          )
          replace_once(
              'src/components/PlayerStrip.tsx',
              '<div className="player-card-main"><div className="player-name"><strong>{player.name}</strong></div><div className="score" data-player-score={player.id}>{displayedScore.toLocaleString()}</div>',
              '<div className="player-card-main"><div className="player-name"><strong>{player.name}</strong>{turnId === player.id && <span className="turn-pill">TURN</span>}</div><div className="score" data-player-score={player.id}>{displayedScore.toLocaleString()}</div>'
          )

          replace_once(
              'src/components/PlayerApp.tsx',
              '<div className="phone-identity"><strong>{me.name}</strong><small>{!recovering && socket.connected ? `ROOM ${room.code}` : \'RECONNECTING…\'}</small></div>',
              '<div className="phone-identity"><strong>{me.name}</strong><small className={room.turnPlayerId === me.id && room.phase !== \'lobby\' && room.phase !== \'recap\' ? \'phone-turn-line\' : \'\'}>{!recovering && socket.connected ? `${room.turnPlayerId === me.id && room.phase !== \'lobby\' && room.phase !== \'recap\' ? \'YOUR TURN · \' : \'\'}ROOM ${room.code}` : \'RECONNECTING…\'}</small></div>'
          )
          replace_once(
              'src/components/PlayerApp.tsx',
              '<div className="section-kicker">NEXT QUESTION</div><h1>Ready.</h1><p>Watch the main game screen.</p>',
              '<div className="section-kicker">{room.turnPlayerId === me.id ? \'YOUR TURN\' : \'NEXT QUESTION\'}</div><h1>{room.turnPlayerId === me.id ? \'You pick.\' : \'Ready.\'}</h1><p>{room.turnPlayerId === me.id ? \'Choose the next question on the main game screen.\' : \'Watch the main game screen.\'}</p>'
          )

          replace_once(
              'src/lib/browserGameEngine.ts',
              "    if (!current) throw new Error('No current question');\n    if (current.responseMode === 'text') current.responsesClosed = true;\n    current.answerRevealed = true;",
              "    if (!current) throw new Error('No current question');\n    if (current.responseMode !== 'text' && !current.dailyDouble && !current.buzzWinnerId && !current.answerRevealed) {\n      this.penalizeUnansweredTurn(room);\n    }\n    if (current.responseMode === 'text') current.responsesClosed = true;\n    current.answerRevealed = true;"
          )

          tests = Path('tests/browserGameEngine.test.ts')
          test_text = tests.read_text()
          marker = "  it('reconnects a reserved seat without changing player identity or seat', () => {"
          if test_text.count(marker) != 1:
              raise SystemExit('Could not locate reconnect test insertion point')
          added_tests = r'''  it('penalizes the selecting player when the host reveals a normal question with no buzz', () => {
    const { engine, host } = setup({ dailyDoublesEnabled: false, finalRoundEnabled: false, allowNegativeScores: true });
    const one = addPlayer(engine, host.roomCode, 'One');
    addPlayer(engine, host.roomCode, 'Two');
    engine.startGame(host.roomCode, host.hostToken);
    const tile = firstUnused(engine, host.roomCode);
    engine.selectQuestion(host.roomCode, host.hostToken, tile.questionId);
    const value = engine.snapshot(host.roomCode).currentQuestion!.effectiveValue;

    engine.revealAnswer(host.roomCode, host.hostToken);

    const state = engine.snapshot(host.roomCode);
    const owner = state.players.find((player) => player.id === one.playerId)!;
    expect(state.currentQuestion?.answerRevealed).toBe(true);
    expect(state.currentQuestion?.timedOut).toBe(true);
    expect(owner.score).toBe(-value);
    expect(owner.stats.incorrect).toBe(1);
  });

  it('does not apply the no-buzz penalty when a Daily Double answer is revealed for judging', () => {
    const { engine, host } = setup({ gameLength: 'quick', dailyDoublesEnabled: true, dailyDoubleCount: 16, finalRoundEnabled: false, allowNegativeScores: true });
    const player = addPlayer(engine, host.roomCode, 'Daily');
    engine.startGame(host.roomCode, host.hostToken);
    const daily = engine.snapshot(host.roomCode).board!.questions.find((question) => question.dailyDouble)!;
    engine.selectQuestion(host.roomCode, host.hostToken, daily.questionId, player.playerId);
    engine.setDailyDoubleWager(host.roomCode, host.hostToken, 100);
    const before = engine.snapshot(host.roomCode).players.find((candidate) => candidate.id === player.playerId)!;

    engine.revealAnswer(host.roomCode, host.hostToken);

    const after = engine.snapshot(host.roomCode).players.find((candidate) => candidate.id === player.playerId)!;
    expect(after.score).toBe(before.score);
    expect(after.stats.incorrect).toBe(before.stats.incorrect);
  });

'''
          tests.write_text(test_text.replace(marker, added_tests + marker, 1))

          css = Path('src/turn-rules-polish.css')
          css_text = css.read_text()
          marker_css = '/* Gameplay UX fixes: readable category intro, visible turn ownership, and unclipped mobile timers. */'
          if marker_css in css_text:
              raise SystemExit('Gameplay UX CSS block already exists')
          css.write_text(css_text + r'''

/* Gameplay UX fixes: readable category intro, visible turn ownership, and unclipped mobile timers. */
.game-transition-overlay.category-transition {
  animation-duration: 5.5s !important;
}

.showcase-player-card.is-turn {
  border-color: #ffd166 !important;
  box-shadow: 0 0 0 2px rgba(255,209,102,.55), 0 0 26px rgba(255,209,102,.24) !important;
}
.turn-pill {
  flex: 0 0 auto;
  margin-left: auto;
  padding: 2px 6px;
  border: 1px solid rgba(255,209,102,.72);
  border-radius: 999px;
  background: rgba(87,61,0,.72);
  color: #ffe39a;
  font-size: .48rem;
  line-height: 1.15;
  font-weight: 1000;
  letter-spacing: .09em;
}
.phone-turn-line {
  color: #ffd166 !important;
  font-weight: 1000 !important;
  letter-spacing: .075em !important;
}

.player-phone-v2 .phone-question-v2 {
  width: 100%;
  overflow: visible !important;
}
.player-phone-v2 .phone-question-v2 .timer,
.player-phone-v2 .final-phone-v2 .timer {
  width: min(520px, calc(100vw - 36px));
  max-width: 100%;
  min-height: 54px;
  margin: 8px auto 2px;
  padding: 2px 8px 10px;
  overflow: visible !important;
  position: relative;
  z-index: 4;
}
.player-phone-v2 .phone-question-v2 .timer > span,
.player-phone-v2 .final-phone-v2 .timer > span {
  min-height: 34px;
  line-height: 1.2;
  overflow: visible;
}
.player-phone-v2 .phone-question-v2 .timer-track,
.player-phone-v2 .final-phone-v2 .timer-track {
  width: 100%;
  margin-top: 4px;
}
''')
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Commit validated fixes
        shell: bash
        run: |
          rm .github/workflows/apply-gameplay-ux-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HostEnhancements.tsx src/components/HostAppV3.tsx src/components/PlayerStrip.tsx src/components/PlayerApp.tsx src/lib/browserGameEngine.ts src/turn-rules-polish.css tests/browserGameEngine.test.ts .github/workflows/apply-gameplay-ux-fixes.yml
          git commit -m "fix: improve turns, reveals, and mobile timing"
          git push origin HEAD:main
