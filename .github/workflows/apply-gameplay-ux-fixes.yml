name: Apply gameplay UX fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gameplay-ux-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted fixes
        run: python scripts/apply-gameplay-ux-fixes.py
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Commit validated fixes
        shell: bash
        run: |
          rm .github/workflows/apply-gameplay-ux-fixes.yml
          rm scripts/apply-gameplay-ux-fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: improve turns, reveals, and mobile timing"
          git push origin HEAD:main
