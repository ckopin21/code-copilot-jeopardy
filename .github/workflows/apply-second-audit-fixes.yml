name: Apply second adversarial audit fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-second-audit-fixes.yml'
      - 'scripts/apply-second-audit-fixes.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply second-audit fixes
        run: python scripts/apply-second-audit-fixes.py
      - name: Correct spoken-clue audit fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/browserGameEngine.test.ts')
          text = path.read_text()
          old = """  it('will not leave an unfinished or unjudged spoken clue', () => {
              const { engine, host } = setup({ dailyDoublesEnabled: false, finalRoundEnabled: false });
              const player = addPlayer(engine, host.roomCode, 'Judge Me');
              engine.startGame(host.roomCode, host.hostToken);
              const tile = firstUnused(engine, host.roomCode);
              engine.selectQuestion(host.roomCode, host.hostToken, tile.questionId);
          """
          new = """  it('will not leave an unfinished or unjudged spoken clue', () => {
              const { engine, host } = setup({ dailyDoublesEnabled: false, finalRoundEnabled: false });
              const player = addPlayer(engine, host.roomCode, 'Judge Me');
              engine.startGame(host.roomCode, host.hostToken);
              const rooms = (engine as unknown as { rooms: Map<string, { questions: Record<string, { responseMode?: 'buzz' | 'text' }> }> }).rooms;
              const record = rooms.get(host.roomCode)!;
              const tile = engine.snapshot(host.roomCode).board!.questions.find((candidate) => !candidate.used && (record.questions[candidate.questionId].responseMode ?? 'buzz') === 'buzz')!;
              engine.selectQuestion(host.roomCode, host.hostToken, tile.questionId);
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one spoken-clue fixture, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Commit validated second-audit fixes
        shell: bash
        run: |
          rm .github/workflows/apply-second-audit-fixes.yml
          rm scripts/apply-second-audit-fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close second-audit game gaps"
          git push origin HEAD:main
