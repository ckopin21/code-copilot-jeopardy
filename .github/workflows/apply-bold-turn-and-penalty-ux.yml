name: Apply bold turn and penalty UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-bold-turn-and-penalty-ux.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted UX fixes
        run: python scripts/apply-bold-turn-and-penalty-ux.py
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Commit validated fixes
        shell: bash
        run: |
          rm .github/workflows/apply-bold-turn-and-penalty-ux.yml
          rm scripts/apply-bold-turn-and-penalty-ux.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: strengthen turn spotlight and unanswered scoring"
          git push origin HEAD:main
