name: Final backend hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-backend-hardening.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply final backend hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          socket_path = Path('src/lib/socket.ts')
          source = socket_path.read_text()

          replacements = [
              (
                  "import { sanitizeRoomSnapshot } from './snapshotSecurity';\n",
                  "import { sanitizeRoomSnapshot } from './snapshotSecurity';\nimport { authorizeRemoteEvent, type RemoteIdentity } from './remoteAuthorization';\n"
              ),
              (
                  "type Identity = { roomCode: string; role: 'host' | 'player' | 'presentation'; playerId?: string };\n",
                  "type Identity = RemoteIdentity;\n"
              ),
              (
                  "function forceRoomOpen(roomCode: string): void {\n  const record = roomRecord(roomCode);\n  if (!record) return;\n  record.state.locked = false;\n  record.state.settings.lockRoomOnStart = false;\n}\n",
                  ""
              ),
              (
                  "      engine.reconnectHost(roomCode, hostToken);\n      forceRoomOpen(roomCode);\n      engine.setHostConnected(roomCode, true);\n",
                  "      engine.reconnectHost(roomCode, hostToken);\n      engine.setHostConnected(roomCode, true);\n"
              ),
              (
                  "      forceRoomOpen(input.roomCode);\n      const credentials = engine.joinPlayer(input.roomCode.toUpperCase(), input);\n",
                  "      const credentials = engine.joinPlayer(input.roomCode.toUpperCase(), input);\n"
              ),
              (
                  "      const updates = { ...((payload.updates ?? {}) as Partial<GameSettings>), lockRoomOnStart: false };\n",
                  "      const updates = (payload.updates ?? {}) as Partial<GameSettings>;\n"
              ),
              (
                  "    case 'host:start-game': {\n      forceRoomOpen(roomCode);\n      const result = engine.startGame(roomCode, hostToken);\n      forceRoomOpen(roomCode);\n      return result;\n    }\n",
                  "    case 'host:start-game': return engine.startGame(roomCode, hostToken);\n"
              ),
              (
                  "    case 'host:reset-game': {\n      const result = engine.resetGame(roomCode, hostToken);\n      forceRoomOpen(roomCode);\n      return result;\n    }\n",
                  "    case 'host:reset-game': return engine.resetGame(roomCode, hostToken);\n"
              ),
              (
                  "      engine.setPlayerConnected(roomCode, playerId, false);\n      closePlayerConnection(playerId, 'player:suspended');\n",
                  "      engine.suspendPlayer(roomCode, hostToken, playerId);\n      closePlayerConnection(playerId, 'player:suspended');\n"
              ),
              (
                  "      closePlayerConnection(playerId, 'player:removed');\n      engine.removePlayer(roomCode, hostToken, playerId);\n",
                  "      engine.removePlayer(roomCode, hostToken, playerId);\n      closePlayerConnection(playerId, 'player:removed');\n"
              ),
              (
                  "    if (message.event.startsWith('host:')) throw new Error('Host actions are not available from remote clients');\n    const data = await dispatchHost(message.event, message.payload, connection);\n",
                  "    authorizeRemoteEvent(identity, message.event, message.payload);\n    const data = await dispatchHost(message.event, message.payload, connection);\n"
              ),
              (
                  "  if (clientPeer && !clientPeer.destroyed) {\n    if (clientPeer.open || clientPeer.disconnected) return Promise.resolve(clientPeer);\n  }\n",
                  "  if (clientPeer && !clientPeer.destroyed) {\n    if (clientPeer.open) return Promise.resolve(clientPeer);\n    try { clientPeer.destroy(); } catch { /* recreate a clean signaling peer */ }\n    clientPeer = null;\n  }\n"
              ),
              (
                  "  const targetRoom = roomCode.toUpperCase();\n  if (clientConnection?.open && clientRoomCode === targetRoom) return clientConnection;\n",
                  "  const targetRoom = roomCode.toUpperCase();\n  if (clientConnection && !clientConnection.open) {\n    const staleConnection = clientConnection;\n    clientConnection = null;\n    try { staleConnection.close(); } catch { /* already closed */ }\n  }\n  if (clientConnection?.open && clientRoomCode === targetRoom) return clientConnection;\n"
              ),
              (
                  "    const settings = { ...((payload.settings ?? {}) as Partial<GameSettings>), lockRoomOnStart: false };\n",
                  "    const settings = (payload.settings ?? {}) as Partial<GameSettings>;\n"
              ),
              (
                  "      forceRoomOpen(credentials.roomCode);\n      engine.setHostConnected(credentials.roomCode, true);\n",
                  "      engine.setHostConnected(credentials.roomCode, true);\n"
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Expected socket block not found:\n{old}')
              source = source.replace(old, new, 1)
          socket_path.write_text(source)

          engine_path = Path('src/lib/browserGameEngine.ts')
          engine = engine_path.read_text()
          marker = "  removePlayer(roomCode: string, hostToken: string, playerId: string): void {\n"
          addition = """  suspendPlayer(roomCode: string, hostToken: string, playerId: string): void {\n    const room = this.hostRoom(roomCode, hostToken);\n    const player = room.state.players.find((item) => item.id === playerId);\n    if (!player) throw new Error('Player not found');\n    this.setPlayerConnected(roomCode, playerId, false);\n  }\n\n"""
          if marker not in engine:
              raise SystemExit('Expected removePlayer marker not found')
          engine = engine.replace(marker, addition + marker, 1)
          engine_path.write_text(engine)

          test_path = Path('tests/browserGameEngine.test.ts')
          tests = test_path.read_text()
          marker = "  it('keeps exact late-game multiplier windows', () => {\n"
          addition = """  it('requires host authorization before suspending a reserved seat', () => {\n    const { engine, host } = setup();\n    const player = addPlayer(engine, host.roomCode);\n\n    expect(() => engine.suspendPlayer(host.roomCode, 'wrong-token', player.playerId)).toThrow(/authorization/i);\n    expect(engine.snapshot(host.roomCode).players[0].connected).toBe(true);\n\n    engine.suspendPlayer(host.roomCode, host.hostToken, player.playerId);\n    expect(engine.snapshot(host.roomCode).players[0].connected).toBe(false);\n  });\n\n  it('honors room locking while reserved players can still reconnect', () => {\n    const { engine, host } = setup({ lockRoomOnStart: true });\n    const player = addPlayer(engine, host.roomCode, 'One');\n    engine.startGame(host.roomCode, host.hostToken);\n\n    expect(() => addPlayer(engine, host.roomCode, 'Two')).toThrow(/locked/i);\n    engine.setPlayerConnected(host.roomCode, player.playerId, false);\n    expect(() => engine.reconnectPlayer(host.roomCode, player.playerId, player.reconnectToken)).not.toThrow();\n  });\n\n"""
          if marker not in tests:
              raise SystemExit('Expected test insertion marker not found')
          tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests)
          PY
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/socket.ts src/lib/browserGameEngine.ts tests/browserGameEngine.test.ts
          git commit -m "fix: harden backend authorization and reconnect lifecycle"
          git push
