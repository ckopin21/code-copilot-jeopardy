name: Fix Daily Double turn layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-daily-double-turn.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python scripts/fix-dd-turn.py
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/browserGameEngine.ts tests/browserGameEngine.test.ts src/turn-rules-polish.css
          git commit -m "fix: keep Daily Doubles host-judged"
          git push origin HEAD:main
