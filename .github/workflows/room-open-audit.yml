name: Always-open room audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-open-audit.yml'
      - 'scripts/apply-room-open-audit.py'

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply audit fix
        run: python scripts/apply-room-open-audit.py
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit audited source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "fix: normalize legacy rooms to always open"
          git push
