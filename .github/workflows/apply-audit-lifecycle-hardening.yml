name: Apply audit lifecycle hardening

on:
  push:
    branches: [audit-hardening-work]
    paths:
      - '.github/workflows/apply-audit-lifecycle-hardening.yml'
      - 'scripts/apply-audit-lifecycle-hardening.py'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Repair score-flight patch count
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-audit-lifecycle-hardening.py')
          text = path.read_text()
          old = 'replace_once("src/components/HostAppV3.tsx", "id: crypto.randomUUID(),", "id: randomId(\'score-flight\'),")'
          new = '''host_path = Path("src/components/HostAppV3.tsx")
host_text = host_path.read_text()
needle = "id: crypto.randomUUID(),"
if host_text.count(needle) != 2:
    raise SystemExit(f"src/components/HostAppV3.tsx: expected 2 randomUUID score ids, found {host_text.count(needle)}")
host_path.write_text(host_text.replace(needle, "id: randomId('score-flight'),"))'''
          if old not in text:
              raise SystemExit('score-flight patch marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply lifecycle/recovery fixes
        run: python scripts/apply-audit-lifecycle-hardening.py
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Commit validated fixes
        shell: bash
        run: |
          rm .github/workflows/apply-audit-lifecycle-hardening.yml
          rm scripts/apply-audit-lifecycle-hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden host and client lifecycle"
          git push origin HEAD:audit-hardening-work
