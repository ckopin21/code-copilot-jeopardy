name: Apply audit lifecycle hardening

on:
  push:
    branches: [audit-hardening-work]
    paths:
      - '.github/workflows/apply-audit-lifecycle-hardening.yml'
      - 'scripts/apply-audit-lifecycle-hardening.py'
      - 'scripts/repair-audit-lifecycle-script.py'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python scripts/repair-audit-lifecycle-script.py
      - name: Apply lifecycle/recovery fixes
        run: python scripts/apply-audit-lifecycle-hardening.py
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Commit validated fixes
        shell: bash
        run: |
          rm .github/workflows/apply-audit-lifecycle-hardening.yml
          rm scripts/apply-audit-lifecycle-hardening.py
          rm scripts/repair-audit-lifecycle-script.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden host and client lifecycle"
          git push origin HEAD:audit-hardening-work
