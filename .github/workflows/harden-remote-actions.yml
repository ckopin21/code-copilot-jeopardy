name: Harden remote actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-remote-actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block host actions from remote P2P clients
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/socket.ts')
          source = path.read_text()
          old = """  try {\n    const data = await dispatchHost(message.event, message.payload, connection);\n"""
          new = """  try {\n    if (message.event.startsWith('host:')) throw new Error('Host actions are not available from remote clients');\n    const data = await dispatchHost(message.event, message.payload, connection);\n"""
          if old not in source:
              raise SystemExit('Expected handleHostRequest block not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit security patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/socket.ts
          git commit -m "security: reject remote host actions"
          git push
