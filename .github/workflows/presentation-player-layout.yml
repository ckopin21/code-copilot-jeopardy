name: Presentation persistence patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/presentation-player-layout.yml'
      - 'scripts/apply-presentation-player-layout.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/apply-presentation-player-layout.py
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit presentation persistence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HostAppV3.tsx
          git commit -m "fix: keep presentation mode active between questions"
          git push
